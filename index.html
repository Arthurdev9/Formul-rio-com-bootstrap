<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Formulário de Cadastro</h1>
        <form>
            <div class="mb-3">
                <label class="form-label" for="Nome">Nome:</label>
                <input class="form-control" type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>
            <div class="mb-3">
                <label class="form-label" for="e-mail">E-mail:</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="Digite seu e-mail">
            </div>
            <div class="mb-3">
                <label class="form-label"  for="telefone">Telefone:</label>
                <input class="form-control" type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
            </div>
            <div class="mb-3">
                <label for="mensagem">Mensagem:</label>
                <textarea class="form-control" id="mensagem" name="mensagem" placeholder="Escreva sua mensagem"></textarea>
            </div>
            <div class="mb-3">
                <button class="btn btn-primary">Enviar</button>
            </div>
        </form>
    </div>
    <footer>
        <p>
            Desenvolvido por <a href="https://github.com/Arthurdev9" target="_blank">Arthur Vinicius</a>
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
